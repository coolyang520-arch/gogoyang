name: Build APK

on:
  push:
    branches-ignore: [build-logs]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        continue-on-error: true
        run: gradle --no-daemon testDebugUnitTest > test.log 2>&1

      - name: Build APK
        run: gradle --no-daemon assembleDebug --stacktrace > build.log 2>&1

      - name: Show logs (branches)
        if: always() && github.ref != 'refs/heads/main'
        run: tail -n 60 test.log; tail -n 150 build.log

      - name: Upload APK (branches)
        if: success() && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: scooter-checker-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk scooter-checker.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest scooter-checker.apk --title "這台機車開過了沒 APK" --notes "Debug build from commit ${GITHUB_SHA::7}. Install on Android and allow installs from this source."

      - name: Publish logs
        if: always() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/logs
          cp build.log test.log /tmp/logs/ 2>/dev/null || true
          git config user.name github-actions
          git config user.email actions@github.com
          git checkout --orphan build-logs
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/logs/* . 2>/dev/null || echo "no logs" > note.txt
          for f in build.log test.log; do [ -f $f ] && tail -n 400 $f > $f.tmp && mv $f.tmp $f; done
          git add -A
          git commit -m "build logs for ${GITHUB_SHA::7}" || true
          git push -f origin build-logs
